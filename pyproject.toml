[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigbid"
version = "0.1.0"
description = "A human-approved multi-agent freelancer copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.12,<2",
    "pydantic>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
    "pypdf>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
rerank = [
    "sentence-transformers>=3.4,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "gigsim_local", "mcp_servers", "rag", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gigbid-starter-kit"]
